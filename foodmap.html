<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼</title>

    <style>

        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
        }

        header {
            display:flex;
            background-color: orange;
            color:white;
            align-items: center;
            justify-content: space-between;
            
        }

        header h1 {
            margin:5px;
            font-size: 30px;
        }

        header button {
            border-radius: 6px;
            font-weight: bold;
            font-size: larger;
        }

        .container{
            display:flex;
            height: calc(100vh - 60px);
            justify-content: space-between;
        }

        .map-area {
            width:70%;
        }

        .map-frame {
            width:100%;
            height: calc(100vh - 60px);
        }

        .list{
            width: 30%;
            box-shadow: -2px 0 5px;
            padding:30px;
            overflow-y: auto;
        }

        .list h2 {
            margin-top:0;
        }


    </style>
</head>
<body>
    
    <header>
        <h1>今天吃什麼?</h1>
        <div>
            <button id = "random">隨機抽取</button>
            <button id = "add">新增店家</button>
        </div>
    </header>

    <div class = "container">
        <div class = "map-area">
            <div id = "map">
                <iframe class="map-frame" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d46091.86835373216!2d121.71041711543543!3d25.11545845797152!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x345d4dfdb8837495%3A0x9ef76baa45f26568!2z5Z-66ZqG5biC!5e0!3m2!1szh-TW!2stw!4v1764218234038!5m2!1szh-TW!2stw" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>                </iframe>
            </div>
        </div>

        <div class = "list">
            <h2>餐廳列表</h2>
            <input type = "text" id = "search" placeholder = "搜尋店名">
            
            <select id ="where">
                <option value = "中正區">中正區</option>
                <option value = "信義區">信義區</option>
                <option value = "仁愛區">仁愛區</option>
                <option value = "中山區">中山區</option>
                <option value = "安樂區">安樂區</option>
                <option value = "七堵區">七堵區</option>
                <option value = "暖暖區">暖暖區</option>
            </select>
            <div id = "storeList"></div>
        </div>
    </div>




</body>
</html>
